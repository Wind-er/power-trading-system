server:
  port: 8000

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  main:
    web-application-type: reactive
  config:
    import: optional:nacos:gateway-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: 674ea0ed-9be0-4c8b-88d9-1305aa71e336
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: 674ea0ed-9be0-4c8b-88d9-1305aa71e336
        group: DEFAULT_GROUP
        file-extension: yml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matching/**
          filters:
            - StripPrefix=1
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/api/trades/**
          filters:
            - StripPrefix=1
        - id: market-service
          uri: lb://market-service
          predicates:
            - Path=/api/market/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.power.trading: DEBUG
