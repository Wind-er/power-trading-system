# 开发环境配置 - 使用H2内存数据库（无需安装MySQL）
spring:
  application:
    name: power-trading-services
  
  datasource:
    url: jdbc:h2:mem:power_trading
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.power.trading: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG

jwt:
  secret: power-trading-secret-key-2024-this-is-a-very-long-secret-key-for-jwt-signing-must-be-at-least-32-characters-long
  expiration: 86400000
