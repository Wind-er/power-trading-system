spring:
  profiles:
    active: dev
  application:
    name: power-trading-services
  
  datasource:
    url: jdbc:h2:mem:power_trading;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

server:
  port: 9090
  servlet:
    context-path: /api

logging:
  level:
    com.power.trading: DEBUG
    org.springframework.web: INFO

jwt:
  secret: power-trading-secret-key-2024-this-is-a-very-long-secret-key-for-jwt-signing-must-be-at-least-32-characters-long
  expiration: 86400000
