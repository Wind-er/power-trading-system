spring:
  profiles:
    active: dev
  application:
    name: power-trading-services
  
  datasource:
    url: jdbc:mysql://localhost:3306/power_trading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.power.trading: DEBUG
    org.springframework.web: INFO

jwt:
  secret: power-trading-secret-key-2024-this-is-a-very-long-secret-key-for-jwt-signing-must-be-at-least-32-characters-long
  expiration: 86400000
